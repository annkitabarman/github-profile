<div
  class="flex min-h-[130px] flex-col rounded-md border border-[#d0d7de] bg-white p-4 transition-colors hover:bg-[#f6f8fa]"
>
  <div class="flex h-6 shrink-0 items-start justify-between gap-3">
    <!-- Repository name -->
    <a href="#" class="truncate font-semibold text-[#0969da] hover:underline">
      {{ repository().name }}
    </a>

    <!-- Public -->
    <span
      class="shrink-0 rounded-full border border-[#d0d7de] px-2 py-0.5 text-xs font-medium text-[#57606a]"
    >
      {{ repository().isPrivate ? 'Private' : 'Public' }}
    </span>
  </div>

  <div class="mt-2 h-10 shrink-0">
    @if (repository().description) {
      <p class="line-clamp-2 text-sm leading-5 text-[#57606a]">
        {{ repository().description }}
      </p>
    }
  </div>

  <div class="mt-2 flex h-4 shrink-0 items-center">
    @if (repository().primaryLanguage; as lang) {
      <div class="flex items-center gap-1.5 text-xs text-[#57606a]">
        <span class="h-3 w-3 rounded-full" [style.background-color]="lang.color"></span>

        {{ lang.name }}
      </div>
    }
  </div>
</div>
