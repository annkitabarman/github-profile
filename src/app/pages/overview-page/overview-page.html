<div class="w-full">
  <!-- Section header -->
  <div class="mb-3 flex items-center justify-between">
    <h2 class="text-base font-semibold text-[#1f2328]">Popular repositories</h2>

    <a href="#" class="text-xs font-semibold text-[#0969da] hover:underline">
      Customize your pins
    </a>
  </div>

  <!-- Repository grid -->
  <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
    @for (repository of repositories; track repository.name) {
      <app-repository-card [repository]="repository" />
    }
  </div>
</div>
