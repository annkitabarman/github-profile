<app-header
  [repoCount]="user()?.public_repos ?? 0"
  [avatar_url]="user()?.avatar_url ?? null"
  [username]="user()?.login ?? ''"
/>

<main class="flex flex-col gap-8 px-8 md:flex-row md:px-10 py-8">
  <!-- Profile -->
  <aside class="w-full md:w-[320px] md:shrink-0">
    <app-profile-sidebar [user]="user()" />
  </aside>

  <!-- Route content -->
  <section class="min-w-0 flex-1">
    <router-outlet />
  </section>
</main>
